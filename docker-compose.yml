version: "3.9"

services:
  backend:
    build: ./backend
    container_name: cardano-live-explorer-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
  
  frontend:
    build: ./frontend/cardano-live-explorer
    container_name: cardano-live-explorer-frontend
    ports:
     - "5173:5173"
    env_file:
      - ./frontend/cardano-live-explorer/.env

    depends_on:
      - backend
    

